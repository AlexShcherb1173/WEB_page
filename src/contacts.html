><!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>
    <!-- Bootstrap CSS из удалённого репозитория -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            overflow-x: hidden;
        }
        .sidebar {
            min-height: 100vh;              /* Высота на весь экран */
            display: flex;
            flex-direction: column;         /* Меню сверху, юзер снизу */
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
        }
        .user-block {
            margin-top: auto;               /* Прижимает вниз */
            border-top: 1px solid #6c757d;  /* Горизонтальная линия */
            padding-top: 10px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Боковое меню -->
        <nav class="col-md-2 col-lg-2 d-md-block bg-dark sidebar text-white p-3">
            <div class="d-flex align-items-center mb-3">
                <span class="fs-4 fw-bold">B</span>
                <span class="ms-2">Меню</span>
            </div>
            <ul class="nav flex-column mb-3">
                <li class="nav-item">
                    <a class="nav-link text-white" href="#">Главная</a>
                </li>
                <li>
                    <a class="nav-link text-white" href="#">Категории</a>
                </li>
                <li>
                    <a class="nav-link text-white" href="#">Заказы</a>
                </li>
                <li>
                    <a class="nav-link active text-white" href="#">Контакты</a>
                </li>
            </ul>

            <!-- Блок пользователя снизу -->
            <div class="dropdown user-block">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="https://via.placeholder.com/32" alt="" width="32" height="32" class="rounded-circle me-2">
                    <strong>Пользователь</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser">
                    <li><a class="dropdown-item" href="#">Профиль</a></li>
                    <li><a class="dropdown-item" href="#">Выход</a></li>
                </ul>
            </div>
        </nav>

        <!-- Контент -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2 text-center">Контакты</h1>
                <p class="text-center">Свяжитесь с нами, используя форму ниже.</p>
            </div>

            <!-- Форма обратной связи -->
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="name" placeholder="Ваше имя">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Сообщение</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="Ваше сообщение"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Отправить</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
